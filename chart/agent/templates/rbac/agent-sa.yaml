apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  namespace: cattle-ai-agent-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-cluster-role
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-agent-cluster-role
subjects:
- kind: ServiceAccount
  name: agent-sa
  namespace: cattle-ai-agent-system
roleRef:
  kind: ClusterRole
  name: agent-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-role
  namespace: cattle-ai-agent-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "update", "patch"]
  resourceNames: ["rancher-ai-agent"]
- apiGroups: ["ai.cattle.io"]
  resources: ["aiagentconfigs"]
  verbs: ["create", "list", "get", "update", "patch", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-agent-sa
  namespace: cattle-ai-agent-system
subjects:
- kind: ServiceAccount
  name: agent-sa
  namespace: cattle-ai-agent-system
roleRef:
  kind: Role
  name: agent-role
  apiGroup: rbac.authorization.k8s.io
