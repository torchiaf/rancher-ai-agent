apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rancher-ai-agent
  name: rancher-ai-agent
  namespace: cattle-ai-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rancher-ai-agent
  template:
    metadata:
      labels:
        app: rancher-ai-agent
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Init container: wait for Redis and MySQL services to be ready before starting the agent
      initContainers:
      - name: wait-for-deps
        image: busybox:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: REDIS_HOST
            value: rancher-ai-redis
          - name: REDIS_PORT
            value: "6379"
          - name: MYSQL_HOST
            value: rancher-ai-mysql
          - name: MYSQL_PORT
            value: "3306"
        command:
          - sh
          - -c
          - |
            set -e
            echo "Waiting for Redis ($REDIS_HOST:$REDIS_PORT) and MySQL ($MYSQL_HOST:$MYSQL_PORT) to become available..."
            # Wait for Redis: try redis-cli if available, otherwise check TCP port
            check_redis() {
              if command -v redis-cli >/dev/null 2>&1; then
                until redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" ping > /dev/null 2>&1; do
                  echo "redis not ready yet..."
                  sleep 1
                done
              else
                until nc -z "$REDIS_HOST" "$REDIS_PORT" > /dev/null 2>&1; do
                  echo "redis TCP not ready yet..."
                  sleep 1
                done
              fi
            }

            # Wait for MySQL TCP to be open
            check_mysql() {
              until nc -z "$MYSQL_HOST" "$MYSQL_PORT" > /dev/null 2>&1; do
                echo "mysql not ready yet..."
                sleep 1
              done
            }

            check_redis
            check_mysql
            echo "dependencies ready"
      containers:
      - image: "{{ .Values.aiAgent.image.repository }}:{{ .Values.aiAgent.image.tag }}"
        imagePullPolicy: "{{ .Values.aiAgent.image.pullPolicy }}"
        name: agent
        env:
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: OPENAI_API_KEY
                optional: true
          - name: MODEL
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: MODEL
                optional: true
          - name: OLLAMA_URL
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: OLLAMA_URL
                optional: true
          - name: GOOGLE_API_KEY
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: GOOGLE_API_KEY
                optional: true
          - name: ACTIVE_LLM
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: ACTIVE_LLM
                optional: true
          - name: SYSTEM_PROMPT
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: SYSTEM_PROMPT
                optional: true
          - name: ENABLE_RAG
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: ENABLE_RAG
                optional: true
          - name: EMBEDDINGS_MODEL
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: EMBEDDINGS_MODEL
                optional: true
          - name: LANGFUSE_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: LANGFUSE_PUBLIC_KEY
                optional: true
          - name: LANGFUSE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: LANGFUSE_SECRET_KEY
                optional: true
          - name: LANGFUSE_HOST
            valueFrom:
              secretKeyRef:
                name: llm-config
                key: LANGFUSE_HOST
                optional: true
          - name: LOG_LEVEL
            value: "{{ .Values.log.level }}"
          - name: DB_HOST
            value: rancher-ai-mysql
          - name: DB_PORT
            value: "3306"
          - name: DB_USER
            value: "root"
          - name: DB_PASSWORD
            value: "{{ .Values.db.mysql.rootPassword }}"
          - name: DB_DATABASE
            value: "{{ .Values.db.mysql.database }}"
        ports:
         - containerPort: 8000
